name: SonarCloud Analysis - Reusable

on:
  workflow_call:
    inputs:
      sonar-project-key:
        description: 'SonarCloud project key (e.g., org_repo-name)'
        required: true
        type: string
      sonar-organization:
        description: 'SonarCloud organization key'
        required: true
        type: string
      sonar-host-url:
        description: 'SonarQube server URL'
        required: false
        type: string
        default: 'https://sonarcloud.io'        
      dockerfile-path:
        description: 'Path to the Dockerfile'
        required: true
        type: string
        default: './Dockerfile'
      image-name:
        description: 'Name of the Docker image to build'
        required: true
        type: string
      default-branch:
        description: 'Default branch name for the repository'
        required: false
        type: string
        default: 'main'
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud authentication token'
        required: true
      ACR_USERNAME:
        description: 'Azure Container Registry username'
        required: true
      ACR_PASSWORD:
        description: 'Azure Container Registry password'
        required: true
      ACR_REGISTRY:
        description: 'Azure Container Registry login server'
        required: true

permissions:
  pull-requests: write  # Required for PR comments
  contents: read
  issues: write  # Optional, for issue comments
  
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para o SonarQube analisar histórico

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup SonarCloud Project
        uses: nelsoncanarinho/setup-sonar-action@v1.0.0
        with:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_NAME: ${{ inputs.sonar-project-key }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

      - name: Install dependencies
        run: npm ci

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.projectName=${{ inputs.sonar-project-key }}
            -Dsonar.organization=${{ inputs.sonar-organization }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/dist/**
            -Dsonar.typescript.tsconfigPath=tsconfig.json
            -Dsonar.sourceEncoding=UTF-8

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        continue-on-error: true

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, sonarqube]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Tag version
        id: generate_tag_version
        run: |
          PACKAGE_VERSION=$(date +'%Y.%m.%d.%H%M%S')
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Push Tag To Github
        if: (github.ref == 'refs/heads/main') && (github.event_name == 'push')
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git tag $PACKAGE_VERSION
          git push origin $PACKAGE_VERSION

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: (github.ref == 'refs/heads/main') && github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_REGISTRY }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=$PACKAGE_VERSION,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'pull_request' }}

      # Build Docker image for Pull Requests to validate the Dockerfile and other process
      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ inputs.dockerfile-path }}
          
      - name: Log in to Azure Container Registry
        if: (github.ref == 'refs/heads/main') && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}          

      - name: Build Docker image (Main branch)
        if: (github.ref == 'refs/heads/main') && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ inputs.dockerfile-path }}